    <script>
      (function () {
        const SITE_NAME = "Cats1337";

        function titleCase(s) {
          return s.replace(/\b([A-Za-z0-9])/g, c => c.toUpperCase());
        }

        function slugToTitle(slug) {
          const decoded = decodeURIComponent(slug);
          return titleCase(
            decoded
              .replace(/\.[a-z0-9]+$/i, "") // drop .html, .htm, etc
              .replace(/[-_]+/g, " ")       // - and _ to spaces
              .replace(/\s+/g, " ")         // collapse spaces
              .trim()
          );
        }

        function collectSegments() {
          // Prefer hash-based router if present (#/about/me)
          if (location.hash.startsWith("#/")) {
            return location.hash.slice(2).split("/");
          }
          return location.pathname.split("/");
        }

        function buildTitle() {
          const segs = collectSegments()
            .filter(Boolean)                               // remove empty
            .filter(s => !/^index(\.[a-z0-9]+)?$/i.test(s))// drop index, index.html
            .map(slugToTitle)
            .filter(Boolean);

          return segs.length ? [SITE_NAME, ...segs].join(" • ") : SITE_NAME;
        }

        function setOrCreateMeta(nameOrProp, value) {
          let el = document.head.querySelector(`meta[name="${nameOrProp}"],meta[property="${nameOrProp}"]`);
          if (!el) {
            el = document.createElement("meta");
            if (nameOrProp.includes(":")) el.setAttribute("property", nameOrProp);
            else el.setAttribute("name", nameOrProp);
            document.head.appendChild(el);
          }
          el.setAttribute("content", value);
        }

        function applyTitle() {
          const t = buildTitle();
          document.title = t;
          setOrCreateMeta("title", t);
          setOrCreateMeta("og:title", t);
          setOrCreateMeta("twitter:title", t);
        }

        // Initial + routers
        document.addEventListener("DOMContentLoaded", applyTitle);
        window.addEventListener("hashchange", applyTitle);
        window.addEventListener("popstate", applyTitle);
        // Catch pushState/replaceState in SPAs
        ["pushState","replaceState"].forEach(method => {
          const orig = history[method];
          if (typeof orig === "function") {
            history[method] = function () {
              const ret = orig.apply(this, arguments);
              setTimeout(applyTitle, 0);
              return ret;
            };
          }
        });
      })();
    </script>

          function isOutbound(a){ try { return a.hostname && a.hostname !== location.hostname; } catch { return false; } }
          function sendAndMaybeFollow(a, e){
            const href = a.href;
            // Don’t hijack new-tab / modifier clicks
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
            e.preventDefault();
            const follow = () => { location.href = href; };
            if (typeof gtag === 'function') {

        (function trackScrollDepth(){
          const fired = {25:false,50:false,75:false,100:false};
          const root = document.scrollingElement || document.documentElement;
          const opts = { passive:true };
          function percentSeen(){
            const y = window.pageYOffset || root.scrollTop || 0;
            const doc = Math.max(root.scrollHeight, root.offsetHeight, root.clientHeight);
            const win = window.innerHeight || root.clientHeight || 0;
            return Math.max(0, Math.min(100, Math.round(((y + win) / doc) * 100)));
          }
          function onScroll(){
            const p = percentSeen();

              if (!fired[th] && p >= th) {

          }
